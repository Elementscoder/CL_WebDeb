<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment Notes</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
            }
            #box, #boxTwo{
                width:75px;
                height:75px;
                background-color: blue;
                color: azure;
                text-align: center;
                border:solid 5px black;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap:5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <h1>Alignmet Notes</h1>
        <div id="boxes">
            <div id="box-wrapper">
                <div id="box" onmouseover="dissapear()" onmouseout="appear()">
                    <p>Box 1</p>
                </div>
                <div id="boxTwo">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
            <div id="flex-wrapper">
                <div id="box">
                    <p>Box 1</p>
                </div>
                <div id="box">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click me</button>
        <button onClick="show()" id="showmore">Show More</button>
        <script>
            //makes the webpage interactive
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor=newColor
            }
            function dissapear(){
                document.getElementById("boxTwo").style.display='none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display='block'
            }
            function show(){
                let element=document.getElementById("flex-wrapper")
                if (element.style.display=="flex"){
                    element.style.display="none"
                    document.getElementById("showmore").innerHTML="Show More"
                }else{
                    element.style.display="flex"
                    document.getElementById("showmore").innerHTML="Show less"
                }
            }
        </script>
    </body>
</html>
