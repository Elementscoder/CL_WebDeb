<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment Notes</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
            }
            #box, #boxTwo{
                width:75px;
                height:75px;
                background-color: blue;
                color: azure;
                text-align: center;
                border:solid 5px black;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap:5px;
            }
            #flex-wrapper{
                display: none;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
            #bird{
                width: 150px;
            }
        </style>
    </head>
    <body>
        <h1>Alignmet Notes</h1>
        <img src="https://img.magnific.com/free-photo/closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.jpg?semt=ais_hybrid&w=740&q=80" alt="bird" id="bird" onmouseout="changeImage()">
        <div id="boxes">
            <div id="box-wrapper">
                <div id="box" onmouseover="dissapear()" onmouseout="appear()">
                    <p>Box 1</p>
                </div>
                <div id="boxTwo">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
            <div id="flex-wrapper">
                <div id="box">
                    <p>Box 1</p>
                </div>
                <div id="box">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
        </div>
        <input type="color" id="colorPicker">
        <br>
        <button onClick="color()">Click me</button>
        <button onClick="show()" id="showmore">Show More</button>
        <script>
            //makes the webpage interactive
            let images = ["https://static.vecteezy.com/vite/assets/photo-masthead-375-BoK_p8LG.webp", "https://i0.wp.com/picjumbo.com/wp-content/uploads/detailed-shot-of-ripples-at-sunset-free-image.jpeg?w=600&quality=80", "https://i0.wp.com/picjumbo.com/wp-content/uploads/beautiful-fall-nature-scenery-free-image.jpeg?w=600&quality=80", "https://img.magnific.com/free-photo/closeup-scarlet-macaw-from-side-view-scarlet-macaw-closeup-head_488145-3540.jpg?semt=ais_hybrid&w=740&q=80"]
            let current = 0
            function changeImage(){
                current += 1
                if (current > 3){
                    current = 0
                }
                document.getElementById("bird").src = images[current]
            }
            function color(){
                let newColor = document.getElementById("colorPicker").value
                document.getElementById("box").style.backgroundColor=newColor
            }
            function dissapear(){
                document.getElementById("boxTwo").style.display='none'
            }
            function appear(){
                document.getElementById("boxTwo").style.display='block'
            }
            function show(){
                let element=document.getElementById("flex-wrapper")
                if (element.style.display=="flex"){
                    element.style.display="none"
                    document.getElementById("showmore").innerHTML="Show More"
                }else{
                    element.style.display="flex"
                    document.getElementById("showmore").innerHTML="Show less"
                }
            }
        </script>
    </body>
</html>
