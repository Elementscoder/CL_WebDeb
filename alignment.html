<!DOCTYPE html>
<html lang="en">
    <head>
        <title>Alignment Notes</title>
        <meta charset="UTF-8">
        <style>
            button{
                padding:20px;
                margin:8px;
            }
            #box{
                width:75px;
                height:75px;
                background-color: blue;
                color: azure;
                text-align: center;
                border:solid 5px black;
            }
            #box-wrapper{
                display: grid;
                grid-template-columns: 1fr 1fr;
                gap:5px;
            }
            #flex-wrapper{
                display: flex;
                flex-direction: row;
                justify-content: center;
                align-items: center;
                justify-content: space-between;
                flex-wrap: wrap;
            }
        </style>
    </head>
    <body>
        <h1>Alignmet Notes</h1>
        <div id="boxes">
            <div id="box-wrapper">
                <div id="box">
                    <p>Box 1</p>
                </div>
                <div id="box">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
            <div id="flex-wrapper">
                <div id="box">
                    <p>Box 1</p>
                </div>
                <div id="box">
                    <p>Box 2</p>
                </div>
                <div id="box">
                    <p>Box 3</p>
                </div>
                <div id="box">
                    <p>Box 4</p>
                </div>
            </div>
        </div>
        <button>Click me</button>
    </body>
</html>
