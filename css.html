<!DOCTYPE html>
<html lang="en">
    <head>
        <title>CSS Styling with Color</title>
        <meta charset="UTF-8">
        <style>
            #first{
                background-color:rgb(255, 0, 0);
                border: solid 4px green;
                width: 100px;
                height: 100px;
            }
            #second{
                background-color:red;
                color: blue;
                border: solid 4px rgb(155, 0, 255);
                width: 100px;
                height: 100px;   
            }
            #third{
                background-color:red;
                color: blue;
                border: solid 4px yellow;
                width: 100px;
                height: 100px; 
            }
        </style>
    </head>
    <body>
        <div id="first"><p>Complementary</p></div>
        <div id="second"><p>Analogous</p></div>
        <div id="third"><p>Triadic</p></div>
</html>
