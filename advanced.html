<!DOCTYPE html>
<html lang = "en">
    <head>
        <title>Advanced HTML Notes</title>
        <meta charset="UTF-8">
        <style>
            /* Cascading Style Sheets 
            1. Selector
            2. Declaration
                a. Property
                b. Value
            */
            body{
                color:paleturquoise;
                background-color:blue;
            }
            h1{
                color:black;
                background-color:aqua;
                text-decoration: underline;
                text-align: center;
            }
            #even{
                color:brown;
                
            }
            .numbered{
                font-size: 20px;
            }
            .important{
                font-weight:bold;
            }
            .ul{
                background-color:rgb(70, 68, 68);
                border-radius: 4px;
                width: 100px;
                height: 100px;
                font-size: 1em;
            }
            #image{
                width:50%
            }
        </style>
    </head>
    <body>
        <h1 class="important">Advanced HTML Notes</h1>
        <h3 class="important">Lists:</h3>
        <div>
        <ol type="I" class="numbered">
            <li>This is the first thing</li>
            <li id="even">This is the second</li>
            <li>This is the third</li>
        </ol>
        <ul class="ul">
            <li><a href="https://freepngimg.com/png/4557-png-apple-image-clipart-transparent-png-apple" target="_blank"> Apple</a></li>
            <li id="even">Banana</li>
            <li>Orange</li>
            <li id="even">Kiwi</li>
        </ul>
        <dl>
            <dt>Fall</dt>
            <dd>Halloween</dd>
            <dd>Thanksgiving</dd>
            <dt>Winter</dt>
            <dd>Christmas</dd>
            <dd>Hanukklah</dd>
            <dd>New Years</dd>
        </dl>
        </div>
        <h3 class="important">Attributes:</h3>
        <img src="https://upload.wikimedia.org/wikipedia/commons/1/12/Mount_Timpanogos_-_01-07-08.jpg?utm_source=commons.wikimedia.org&utm_campaign=index&utm_content=original" alt="Mount Timp" id="image">
        <p>Image from <a href="https://commons.wikimedia.org/wiki/File:Mount_Timpanogos_-_01-07-08.jpg" target="_blank"> Wikimedia Commons</a></p>
    </body>
</html>
